<app-navbar></app-navbar>

<!-- Background Section -->
<div class="container-fluid py-5"
     style="min-height: 90vh;
            background-image: url('assets/whit.jpg');
            background-size: cover;
            background-position: center;">

  <div class="container">

    <!-- Heading -->
    <h2 class="text-center text-primary fw-bold mb-3">
      <i class="fa-solid fa-users"></i> Role List
    </h2>

    <!-- Message -->
    <div class="text-center mb-3">
      <div *ngIf="!form.error && form.message" class="alert alert-success p-2">
        {{ form.message }}
      </div>
      <div *ngIf="form.error && form.message" class="alert alert-danger p-2">
        {{ form.message }}
      </div>
    </div>

    <!-- Search Card -->
    <div class="card shadow-sm p-3 mb-4">
      <div class="row align-items-center">

        <div class="col-md-4">
          <label class="fw-semibold">Role</label>
          <select class="form-select" name="id" [(ngModel)]="form.id">
            <option value="undefined">------------Select------------</option>
            <option *ngFor="let obj of form.preload.roleList" [value]="obj.id">
              {{ obj.name }}
            </option>
          </select>
        </div>

        <div class="col-md-8 text-end mt-3 mt-md-0">
          <button class="btn btn-primary me-2" (click)="search()">
            <i class="fa-solid fa-magnifying-glass"></i> Search
          </button>

          <button class="btn btn-secondary" (click)="reset()">
            <i class="fa-solid fa-rotate"></i> Reset
          </button>
        </div>

      </div>
    </div>

    <!-- Table -->
    <div *ngIf="form.list.length > 0" class="card shadow-lg p-3">

      <div class="table-responsive">
        <table class="table table-bordered table-hover text-center align-middle">

          <thead class="table-primary">
            <tr>
              <th>
                <input type="checkbox"
                       [(ngModel)]="isMasterSel"
                       (change)="checkUncheckAll($event)" />
              </th>
              <th>S.No</th>
              <th>Name</th>
              <th>Description</th>
              <th>Edit</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let m of form.list; let i = index">
              <td>
            <input type="checkbox"
                   #checkboxes
                   (change)="checklistUpdate()"
                   [id]="m.id"
                   [value]="isMasterSel">
          </td>

              <td>{{ (form.pageNo * 5) + i + 1 }}</td>
              <td>{{ m.name }}</td>
              <td>{{ m.description }}</td>

              <td>
                <button class="btn btn-sm btn-warning"
                        (click)="forward('/role/' + m.id)">
                  <i class="fa-solid fa-pen"></i>
                </button>
              </td>
            </tr>
          </tbody>

        </table>
      </div>

      <!-- Pagination + Actions -->
      <div class="row mt-3">

        <div class="col-md-3">
          <button class="btn btn-outline-primary w-100"
                  (click)="previous()"
                  [disabled]="form.pageNo == 0">
            <i class="fa-solid fa-arrow-left"></i> Previous
          </button>
        </div>

        <div class="col-md-3">
          <button class="btn btn-success w-100"
                  (click)="forward('/role')">
            <i class="fa-solid fa-plus"></i> New
          </button>
        </div>

        <div class="col-md-3">
          <button class="btn btn-danger w-100"
                  (click)="delete()">
            <i class="fa-solid fa-trash"></i> Delete
          </button>
        </div>

        <div class="col-md-3 text-end">
          <button class="btn btn-outline-primary w-100"
                  (click)="next()"
                  [disabled]="form.list.length < 5">
            Next <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>

      </div>

    </div>

    <!-- No Data -->
    <div *ngIf="form.list.length == 0" class="text-center">
      <button class="btn btn-secondary" (click)="reset()">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
    </div>

  </div>
</div>

<app-footer></app-footer>
