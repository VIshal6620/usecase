<!-- Navbar -->
<app-navbar></app-navbar>

<!-- Background Section -->
<div class="container-fluid d-flex justify-content-center align-items-center"
     style="min-height: 90vh;
            background-image: url('assets/whit.jpg');
            background-size: cover;
            background-position: center;">

  <!-- Card Form -->
  <div class="card shadow-lg p-4" style="width: 400px; border-radius: 15px;">

    <!-- Heading -->
    <h2 class="text-center mb-3 text-primary fw-bold">
      <i class="fa-solid fa-user-shield"></i>
      {{ form.data.id > 0 ? 'Update Role' : 'Add Role' }}
    </h2>

    <!-- Success / Error Message -->
    <div class="text-center mb-2">
      <div *ngIf="!form.error && form.message" class="alert alert-success p-1">
        {{ form.message }}
      </div>
      <div *ngIf="form.error && form.message" class="alert alert-danger p-1">
        {{ form.message }}
      </div>
    </div>

    <!-- Form -->
    <form>

      <!-- Name Field -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Name <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text"
                 class="form-control"
                 name="name"
                 [(ngModel)]="form.data.name"
                 placeholder="Enter Role Name">
        </div>
        <small class="text-danger">{{ form.inputerror.name }}</small>
      </div>

      <!-- Description Field -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Description <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-file-lines"></i>
          </span>
          <textarea class="form-control"
                    name="description"
                    [(ngModel)]="form.data.description"
                    rows="3"
                    placeholder="Enter short description"></textarea>
        </div>
        <small class="text-danger">{{ form.inputerror.description }}</small>
      </div>

      <!-- Buttons -->
      <div class="text-center">
        <button type="button"
                class="btn btn-primary px-4"
                (click)="submit()">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>

        <!-- Optional List Button -->
        <!--
        <button type="button"
                class="btn btn-secondary ms-2"
                (click)="forward('/rolelist')">
          <i class="fa-solid fa-list"></i> List
        </button>
        -->
      </div>

    </form>

  </div>
</div>

<!-- Footer -->
<app-footer></app-footer>
