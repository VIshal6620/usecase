<app-navbar></app-navbar>

<div align="center" style="padding-top: 20px;">

    <!-- Heading -->
    <h2 style="margin-bottom: 10px; color: navy;">
        <i class="fa-solid fa-microphone"></i>
        <span *ngIf="!form.data.id">Add Speaker</span>
        <span *ngIf="form.data.id>0">Update Speaker</span>
    </h2>

    <!-- Message -->
    <div style="height: 20px; margin-bottom: 10px;">
        <h6 class="text-success" *ngIf="!form.error && form.message">{{ form.message }}</h6>
        <h6 class="text-danger" *ngIf="form.error && form.message">{{ form.message }}</h6>
    </div>

    <!-- Card -->
    <div class="card shadow p-3"
         style="width: 100%; max-width: 500px; border-radius: 10px;">

        <table class="table table-borderless">

            <!-- Speaker Name -->
            <tr>
                <th align="left">
                    <i class="fa-solid fa-user"></i> SpeakerName <span class="text-danger">*</span>
                </th>
                <td>
                    <input type="text"
                           class="form-control form-control-sm"
                           name="speakerName"
                           [(ngModel)]="form.data.speakerName"
                           placeholder="Enter speakerName">
                </td>
                <td class="text-danger small">
                    {{form.inputerror.speakerName}}
                </td>
            </tr>

            <!-- Topic -->
            <tr>
                <th align="left">
                    <i class="fa-solid fa-book-open"></i> Topic <span class="text-danger">*</span>
                </th>
                <td>
                    <input type="text"
                           class="form-control form-control-sm"
                           name="topic"
                           [(ngModel)]="form.data.topic"
                           placeholder="Enter topic">
                </td>
                <td class="text-danger small">
                    {{form.inputerror.topic}}
                </td>
            </tr>

            <!-- Organization -->
            <tr>
                <th align="left">
                    <i class="fa-solid fa-building"></i> Organization <span class="text-danger">*</span>
                </th>
                <td>
                    <input type="text"
                           class="form-control form-control-sm"
                           name="organization"
                           [(ngModel)]="form.data.organization"
                           placeholder="Enter organization">
                </td>
                <td class="text-danger small">
                    {{form.inputerror.organization}}
                </td>
            </tr>

            <!-- Button -->
            <tr>
                <th></th>
                <td colspan="2">
                    <button class="btn btn-primary btn-sm w-100"
                            (click)="submit()">
                        <i class="fa-solid fa-floppy-disk"></i> Save
                    </button>
                </td>
            </tr>

        </table>

    </div>
</div>

<app-footer></app-footer>
