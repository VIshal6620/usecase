<app-navbar></app-navbar>

<div align="center">
    <h1 *ngIf="!form.data.id" align="center" style="margin-bottom: 5px; color: navy">Add Travel</h1>
    <h1 *ngIf="form.data.id>0" align="center" style="margin-bottom: 5px; color: navy">Update Travel</h1>

    <div style="height: 20px; margin-bottom: 10px; text-align: center;">
        <h3 style="margin: 0; color: green;" *ngIf="!form.error && form.message">{{ form.message }}</h3>
        <h3 style="margin: 0; color: red;" *ngIf="form.error && form.message">{{ form.message }}</h3>
    </div>

    <table>
        <tr>
            <th align="left">TravelerName<span style="color: red">*</span></th>
            <td><input type="text" name="travelerName" [(ngModel)]="form.data.travelerName" placeholder="Enter travelerName"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.travelerName}}</td>
        </tr>

        <tr>
            <th align="left">Destination<span style="color: red">*</span></th>
            <td><input type="text" name="destination" [(ngModel)]="form.data.destination" placeholder="Enter destination"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.destination}}</td>
        </tr>

        <tr>
            <th align="left">StartDate<span style="color: red">*</span></th>
            <td><input type="date" name="startDate" [(ngModel)]="form.data.startDate" placeholder="Enter startDate" style="width: 97%;"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.startDate}}</td>
        </tr>

        <tr>
            <th align="left">EndtDate<span style="color: red">*</span></th>
            <td><input type="date" name="endDate" [(ngModel)]="form.data.endDate" placeholder="Enter endDate" style="width: 97%;"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.endDate}}</td>
        </tr>

        <tr></tr>

        <tr>
            <th></th>
            <td align="left" colspan="2">
                <button (click)="submit()">save</button> &nbsp;
                
            </td>
        </tr>
    </table>
</div>

<app-footer></app-footer>
