<app-navbar></app-navbar>

<div align="center" style="padding-top: 20px;">

    <!-- Heading -->
    <h2 style="margin-bottom: 10px; color: navy;">
        <i class="fa-solid fa-plane"></i>
        <span *ngIf="!form.data.id">Add Travel</span>
        <span *ngIf="form.data.id>0">Update Travel</span>
    </h2>

    <!-- Message -->
    <div style="height: 20px; margin-bottom: 10px;">
        <h6 class="text-success" *ngIf="!form.error && form.message">{{ form.message }}</h6>
        <h6 class="text-danger" *ngIf="form.error && form.message">{{ form.message }}</h6>
    </div>

    <!-- Card -->
    <div class="card shadow p-3"
         style="width: 100%; max-width: 500px; border-radius: 10px;">

        <table class="table table-borderless">

            <!-- Traveler Name -->
            <tr>
                <th align="left">
                    <i class="fa-solid fa-user"></i> TravelerName <span class="text-danger">*</span>
                </th>
                <td>
                    <input type="text"
                           class="form-control form-control-sm"
                           name="travelerName"
                           [(ngModel)]="form.data.travelerName"
                           placeholder="Enter travelerName">
                </td>
                <td class="text-danger small">
                    {{form.inputerror.travelerName}}
                </td>
            </tr>

            <!-- Destination -->
            <tr>
                <th align="left">
                    <i class="fa-solid fa-location-dot"></i> Destination <span class="text-danger">*</span>
                </th>
                <td>
                    <input type="text"
                           class="form-control form-control-sm"
                           name="destination"
                           [(ngModel)]="form.data.destination"
                           placeholder="Enter destination">
                </td>
                <td class="text-danger small">
                    {{form.inputerror.destination}}
                </td>
            </tr>

            <!-- Start Date -->
            <tr>
                <th align="left">
                    <i class="fa-solid fa-calendar-days"></i> StartDate <span class="text-danger">*</span>
                </th>
                <td>
                    <input type="date"
                           class="form-control form-control-sm"
                           name="startDate"
                           [(ngModel)]="form.data.startDate">
                </td>
                <td class="text-danger small">
                    {{form.inputerror.startDate}}
                </td>
            </tr>

            <!-- End Date -->
            <tr>
                <th align="left">
                    <i class="fa-solid fa-calendar-check"></i> EndDate <span class="text-danger">*</span>
                </th>
                <td>
                    <input type="date"
                           class="form-control form-control-sm"
                           name="endDate"
                           [(ngModel)]="form.data.endDate">
                </td>
                <td class="text-danger small">
                    {{form.inputerror.endDate}}
                </td>
            </tr>

            <!-- Button -->
            <tr>
                <th></th>
                <td colspan="2">
                    <button class="btn btn-primary btn-sm w-100"
                            (click)="submit()">
                        <i class="fa-solid fa-floppy-disk"></i> Save
                    </button>
                </td>
            </tr>

        </table>

    </div>
</div>

<app-footer></app-footer>
