<app-navbar></app-navbar>

<!-- Background -->
<div class="container-fluid d-flex justify-content-center align-items-center"
     style="min-height: 90vh;
            background-image: url('assets/whit.jpg');
            background-size: cover;
            background-position: center;">

  <!-- Card -->
  <div class="card shadow-lg p-4" style="width: 420px; border-radius: 15px;">

    <!-- Heading -->
    <h2 class="text-center text-primary fw-bold mb-3">
      <i class="fa-solid fa-gift"></i>
      {{ form.data.id > 0 ? 'Update Reward' : 'Add Reward' }}
    </h2>

    <!-- Message -->
    <div class="text-center mb-2">
      <div *ngIf="!form.error && form.message" class="alert alert-success p-1">
        {{ form.message }}
      </div>
      <div *ngIf="form.error && form.message" class="alert alert-danger p-1">
        {{ form.message }}
      </div>
    </div>

    <!-- Form -->
    <form>

      <!-- Reward Code -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Reward Code <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-barcode"></i>
          </span>
          <input type="text"
                 class="form-control"
                 name="rewardCode"
                 [(ngModel)]="form.data.rewardCode"
                 placeholder="Enter Reward Code">
        </div>
        <small class="text-danger">{{ form.inputerror.rewardCode }}</small>
      </div>

      <!-- Reward Name -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Reward Name <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-tag"></i>
          </span>
          <input type="text"
                 class="form-control"
                 name="rewardName"
                 [(ngModel)]="form.data.rewardName"
                 placeholder="Enter Reward Name">
        </div>
        <small class="text-danger">{{ form.inputerror.rewardName }}</small>
      </div>

      <!-- Reward Amount -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Reward Amount <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-indian-rupee-sign"></i>
          </span>
          <input type="number"
                 class="form-control"
                 name="rewardAmount"
                 [(ngModel)]="form.data.rewardAmount"
                 placeholder="Enter Amount">
        </div>
        <small class="text-danger">{{ form.inputerror.rewardAmount }}</small>
      </div>

      <!-- Reward Status -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Reward Status <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-circle-check"></i>
          </span>
          <input type="text"
                 class="form-control"
                 name="rewardStatus"
                 [(ngModel)]="form.data.rewardStatus"
                 placeholder="Enter Status (Active/Inactive)">
        </div>
        <small class="text-danger">{{ form.inputerror.rewardStatus }}</small>
      </div>

      <!-- Button -->
      <div class="text-center">
        <button type="button"
                class="btn btn-primary px-4"
                (click)="submit()">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>
      </div>

    </form>

  </div>
</div>

<app-footer></app-footer>
