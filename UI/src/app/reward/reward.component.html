<app-navbar></app-navbar>

<div align="center">
    <h1 *ngIf="!form.data.id" align="center" style="margin-bottom: 5px; color: navy">Add Reward</h1>
    <h1 *ngIf="form.data.id>0" align="center" style="margin-bottom: 5px; color: navy">Update Reward</h1>

    <div style="height: 20px; margin-bottom: 10px; text-align: center;">
        <h3 style="margin: 0; color: green;" *ngIf="!form.error && form.message">{{ form.message }}</h3>
        <h3 style="margin: 0; color: red;" *ngIf="form.error && form.message">{{ form.message }}</h3>
    </div>

    <table>
        <tr>
            <th align="left">rewardCode<span style="color: red">*</span></th>
            <td><input type="text" name="rewardCode" [(ngModel)]="form.data.rewardCode" placeholder="Enter rewardCode"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.rewardCode}}</td>
        </tr>

        <tr>
            <th align="left">rewardName<span style="color: red">*</span></th>
            <td><input type="text" name="rewardName" [(ngModel)]="form.data.rewardName" placeholder="Enter rewardName"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.rewardName}}</td>
        </tr>

        <tr>
            <th align="left">rewardAmount<span style="color: red">*</span></th>
            <td><input type="text" name="rewardAmount" [(ngModel)]="form.data.rewardAmount" placeholder="Enter rewardAmount" style="width: 97%;"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.rewardAmount}}</td>
        </tr>

        <tr>
            <th align="left">rewardStatus<span style="color: red">*</span></th>
            <td><input type="text" name="rewardStatus" [(ngModel)]="form.data.rewardStatus" placeholder="Enter rewardStatus" style="width: 97%;"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.rewardStatus}}</td>
        </tr>

        <tr></tr>

        <tr>
            <th></th>
            <td align="left" colspan="2">
                <button (click)="submit()">save</button> &nbsp;
            </td>
        </tr>
    </table>
</div>

<app-footer></app-footer>
