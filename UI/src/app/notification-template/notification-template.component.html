<app-navbar></app-navbar>

<div align="center"
     style="min-height: 90vh;
            padding: 40px;
            background-image: url('assets/whit.jpg');
            background-size: cover;
            background-position: center;">

    <h1 *ngIf="!form.data.id" style="margin-bottom: 10px; color: navy;">
        Add NotificationTemplate
    </h1>

    <h1 *ngIf="form.data.id>0" style="margin-bottom: 10px; color: navy;">
        Update NotificationTemplate
    </h1>

    <!-- Message -->
    <div style="height: 25px; margin-bottom: 15px;">
        <h3 style="margin: 0; color: green;" *ngIf="!form.error && form.message">
            {{ form.message }}
        </h3>
        <h3 style="margin: 0; color: red;" *ngIf="form.error && form.message">
            {{ form.message }}
        </h3>
    </div>

    <!-- Table Form -->
    <table style="padding: 20px;
                  background: white;
                  border-radius: 10px;
                  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
                  width: 400px;">

        <!-- Template Code -->
        <tr>
            <th align="left" style="padding: 8px;">TemplateCode<span style="color:red">*</span></th>
            <td style="padding: 8px;">
                <input type="text"
                       name="templateCode"
                       [(ngModel)]="form.data.templateCode"
                       placeholder="Enter templateCode"
                       style="width: 100%; padding: 6px;">
            </td>
        </tr>
        <tr>
            <td></td>
            <td style="color:red; font-size: 12px;">
                {{form.inputerror.templateCode}}
            </td>
        </tr>

        <!-- Title -->
        <tr>
            <th align="left" style="padding: 8px;">Title<span style="color:red">*</span></th>
            <td style="padding: 8px;">
                <input type="text"
                       name="title"
                       [(ngModel)]="form.data.title"
                       placeholder="Enter title"
                       style="width: 100%; padding: 6px;">
            </td>
        </tr>
        <tr>
            <td></td>
            <td style="color:red; font-size: 12px;">
                {{form.inputerror.title}}
            </td>
        </tr>

        <!-- Content -->
        <tr>
            <th align="left" style="padding: 8px;">Content<span style="color:red">*</span></th>
            <td style="padding: 8px;">
                <input type="text"
                       name="content"
                       [(ngModel)]="form.data.content"
                       placeholder="Enter content"
                       style="width: 100%; padding: 6px;">
            </td>
        </tr>
        <tr>
            <td></td>
            <td style="color:red; font-size: 12px;">
                {{form.inputerror.content}}
            </td>
        </tr>

        <!-- Status -->
        <tr>
            <th align="left" style="padding: 8px;">Status<span style="color:red">*</span></th>
            <td style="padding: 8px;">
                <input type="text"
                       name="status"
                       [(ngModel)]="form.data.status"
                       placeholder="Enter status"
                       style="width: 100%; padding: 6px;">
            </td>
        </tr>
        <tr>
            <td></td>
            <td style="color:red; font-size: 12px;">
                {{form.inputerror.status}}
            </td>
        </tr>

        <!-- Button -->
        <tr>
            <td></td>
            <td style="padding: 10px;">
                <button (click)="submit()"
                        style="padding: 6px 15px; font-size: 13px;">
                    Save
                </button>
            </td>
        </tr>

    </table>
</div>

<app-footer></app-footer>
