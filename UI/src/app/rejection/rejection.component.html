<app-navbar></app-navbar>

<div align="center">
    <h1 *ngIf="!form.data.id" align="center" style="margin-bottom: 5px; color: navy">Add Rejection</h1>
    <h1 *ngIf="form.data.id>0" align="center" style="margin-bottom: 5px; color: navy">Update Rejection</h1>

    <div style="height: 20px; margin-bottom: 10px; text-align: center;">
        <h3 style="margin: 0; color: green;" *ngIf="!form.error && form.message">{{ form.message }}</h3>
        <h3 style="margin: 0; color: red;" *ngIf="form.error && form.message">{{ form.message }}</h3>
    </div>

    <table>
        <tr>
            <th align="left">Rejection Code<span style="color: red">*</span></th>
            <td><input type="text" name="rejectionCode" [(ngModel)]="form.data.rejectionCode" placeholder="Enter rejectionCode"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.rejectionCode}}</td>
        </tr>

        <tr>
            <th align="left">Request Name<span style="color: red">*</span></th>
            <td><input type="text" name="requestName" [(ngModel)]="form.data.requestName" placeholder="Enter requestName"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.requestName}}</td>
        </tr>

        <tr>
            <th align="left">Rejection Reason<span style="color: red">*</span></th>
            <td><input type="text" name="rejectionReason" [(ngModel)]="form.data.rejectionReason" placeholder="Enter rejectionReason" style="width: 97%;"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.rejectionReason}}</td>
        </tr>

        <tr>
            <th align="left">RejectionStatus<span style="color: red">*</span></th>
            <td><input type="text" name="rejectionStatus" [(ngModel)]="form.data.rejectionStatus" placeholder="Enter rejectionStatus" style="width: 97%;"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.rejectionStatus}}</td>
        </tr>

        <tr></tr>

        <tr>
            <th></th>
            <td align="left" colspan="2">
                <button (click)="submit()">save</button> &nbsp;
            </td>
        </tr>
    </table>
</div>

<app-footer></app-footer>
