<app-navbar></app-navbar>

<!-- Background -->
<div class="container-fluid d-flex justify-content-center align-items-center"
     style="min-height: 90vh;
            background-image: url('assets/whit.jpg');
            background-size: cover;
            background-position: center;">

  <!-- Card -->
  <div class="card shadow-lg p-4" style="width: 420px; border-radius: 15px;">

    <!-- Heading -->
    <h2 class="text-center text-primary fw-bold mb-3">
      <i class="fa-solid fa-ban"></i>
      {{ form.data.id > 0 ? 'Update Rejection' : 'Add Rejection' }}
    </h2>

    <!-- Message -->
    <div class="text-center mb-2">
      <div *ngIf="!form.error && form.message" class="alert alert-success py-1">
        {{ form.message }}
      </div>
      <div *ngIf="form.error && form.message" class="alert alert-danger py-1">
        {{ form.message }}
      </div>
    </div>

    <!-- Form -->
    <form>

      <!-- Rejection Code -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Rejection Code <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-barcode"></i>
          </span>
          <input type="text"
                 class="form-control"
                 name="rejectionCode"
                 [(ngModel)]="form.data.rejectionCode"
                 placeholder="Enter Rejection Code">
        </div>
        <small class="text-danger">{{ form.inputerror.rejectionCode }}</small>
      </div>

      <!-- Request Name -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Request Name <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text"
                 class="form-control"
                 name="requestName"
                 [(ngModel)]="form.data.requestName"
                 placeholder="Enter Request Name">
        </div>
        <small class="text-danger">{{ form.inputerror.requestName }}</small>
      </div>

      <!-- Rejection Reason -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Rejection Reason <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-circle-exclamation"></i>
          </span>
          <textarea class="form-control"
                    name="rejectionReason"
                    [(ngModel)]="form.data.rejectionReason"
                    rows="3"
                    placeholder="Enter Rejection Reason"></textarea>
        </div>
        <small class="text-danger">{{ form.inputerror.rejectionReason }}</small>
      </div>

      <!-- Status -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Rejection Status <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-toggle-on"></i>
          </span>
          <select class="form-select"
                  name="rejectionStatus"
                  [(ngModel)]="form.data.rejectionStatus">
            <option value="">Select Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
        <small class="text-danger">{{ form.inputerror.rejectionStatus }}</small>
      </div>

      <!-- Button -->
      <div class="text-center">
        <button type="button"
                class="btn btn-primary btn-sm px-4"
                (click)="submit()">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>
      </div>

    </form>

  </div>
</div>

<app-footer></app-footer>
