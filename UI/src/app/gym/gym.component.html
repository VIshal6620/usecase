<app-navbar></app-navbar>

<div align="center"
     style="min-height: 90vh;
            padding: 40px;
            background-image: url('assets/whit.jpg');
            background-size: cover;
            background-position: center;">

    <!-- Heading -->
    <h1 *ngIf="!form.data.id" style="margin-bottom: 10px; color: navy">
        <i class="fa-solid fa-dumbbell"></i> Add Gym
    </h1>

    <h1 *ngIf="form.data.id>0" style="margin-bottom: 10px; color: navy">
        <i class="fa-solid fa-pen-to-square"></i> Update Gym
    </h1>

    <!-- Message -->
    <div style="height: 25px; margin-bottom: 15px;">
        <h3 class="text-success m-0" *ngIf="!form.error && form.message">
            {{ form.message }}
        </h3>
        <h3 class="text-danger m-0" *ngIf="form.error && form.message">
            {{ form.message }}
        </h3>
    </div>

    <!-- Table Form -->
    <table class="table table-bordered shadow"
           style="background:white; border-radius:10px; width:420px; overflow:hidden;">

        <!-- Member Name -->
        <tr>
            <th class="text-start p-2">
                <i class="fa-solid fa-user"></i>
                MemberName <span class="text-danger">*</span>
            </th>
            <td class="p-2">
                <input type="text"
                       class="form-control form-control-sm"
                       name="memberName"
                       [(ngModel)]="form.data.memberName"
                       placeholder="Enter Member Name">
            </td>
        </tr>
        <tr>
            <td></td>
            <td class="text-danger small">
                {{form.inputerror.memberName}}
            </td>
        </tr>

        <!-- Membership Type -->
        <tr>
            <th class="text-start p-2">
                <i class="fa-solid fa-id-card"></i>
                MembershipType <span class="text-danger">*</span>
            </th>
            <td class="p-2">
                <input type="text"
                       class="form-control form-control-sm"
                       name="membershipType"
                       [(ngModel)]="form.data.membershipType"
                       placeholder="Enter Membership Type">
            </td>
        </tr>
        <tr>
            <td></td>
            <td class="text-danger small">
                {{form.inputerror.membershipType}}
            </td>
        </tr>

        <!-- Start Date -->
        <tr>
            <th class="text-start p-2">
                <i class="fa-solid fa-calendar-plus"></i>
                StartDate <span class="text-danger">*</span>
            </th>
            <td class="p-2">
                <input type="date"
                       class="form-control form-control-sm"
                       name="startDate"
                       [(ngModel)]="form.data.startDate">
            </td>
        </tr>
        <tr>
            <td></td>
            <td class="text-danger small">
                {{form.inputerror.startDate}}
            </td>
        </tr>

        <!-- End Date -->
        <tr>
            <th class="text-start p-2">
                <i class="fa-solid fa-calendar-check"></i>
                EndDate <span class="text-danger">*</span>
            </th>
            <td class="p-2">
                <input type="date"
                       class="form-control form-control-sm"
                       name="endDate"
                       [(ngModel)]="form.data.endDate">
            </td>
        </tr>
        <tr>
            <td></td>
            <td class="text-danger small">
                {{form.inputerror.endDate}}
            </td>
        </tr>

        <!-- Button -->
        <tr>
            <td></td>
            <td class="p-3">
                <button class="btn btn-primary btn-sm px-4"
                        (click)="submit()">
                    <i class="fa-solid fa-floppy-disk"></i> Save
                </button>
            </td>
        </tr>

    </table>
</div>

<app-footer></app-footer>
