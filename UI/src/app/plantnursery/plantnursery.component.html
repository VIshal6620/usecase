<app-navbar></app-navbar>

<!-- Background -->
<div class="container-fluid d-flex justify-content-center align-items-center"
     style="min-height: 90vh;
            background-image: url('assets/whit.jpg');
            background-size: cover;
            background-position: center;">

  <!-- Card -->
  <div class="card shadow-lg p-4" style="width: 420px; border-radius: 15px;">

    <!-- Heading -->
    <h2 class="text-center text-primary fw-bold mb-3">
      <i class="fa-solid fa-seedling"></i>
      {{ form.data.id > 0 ? 'Update Plant Nursery' : 'Add Plant Nursery' }}
    </h2>

    <!-- Message -->
    <div class="text-center mb-2">
      <div *ngIf="!form.error && form.message" class="alert alert-success py-1">
        {{ form.message }}
      </div>
      <div *ngIf="form.error && form.message" class="alert alert-danger py-1">
        {{ form.message }}
      </div>
    </div>

    <!-- Form -->
    <form>

      <!-- Plant Name -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Plant Name <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-leaf"></i>
          </span>
          <input type="text"
                 class="form-control"
                 name="plantName"
                 [(ngModel)]="form.data.plantName"
                 placeholder="Enter Plant Name">
        </div>
        <small class="text-danger">{{ form.inputerror.plantName }}</small>
      </div>

      <!-- Category -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Category <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-layer-group"></i>
          </span>
          <input type="text"
                 class="form-control"
                 name="category"
                 [(ngModel)]="form.data.category"
                 placeholder="Enter Category">
        </div>
        <small class="text-danger">{{ form.inputerror.category }}</small>
      </div>

      <!-- Quantity -->
      <div class="mb-3">
        <label class="form-label fw-semibold">
          Quantity <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fa-solid fa-boxes-stacked"></i>
          </span>
          <input type="number"
                 class="form-control"
                 name="quantity"
                 [(ngModel)]="form.data.quantity"
                 placeholder="Enter Quantity">
        </div>
        <small class="text-danger">{{ form.inputerror.quantity }}</small>
      </div>

      <!-- Button -->
      <div class="text-center">
        <button type="button"
                class="btn btn-primary btn-sm px-4"
                (click)="submit()">
          <i class="fa-solid fa-floppy-disk"></i> Save
        </button>
      </div>

    </form>

  </div>
</div>

<app-footer></app-footer>
