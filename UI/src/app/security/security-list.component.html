<app-navbar></app-navbar>

<!-- Full Width Container -->
<div style="width: 100%; padding: 15px;">

    <h2 align="center" style="margin-bottom: 10px; color: navy;">
        Security List
    </h2>

    <!-- Message -->
    <div style="height: 20px; margin-bottom: 10px; text-align: center;">
        <h5 style="margin: 0; color: green;" *ngIf="!form.error && form.message">{{ form.message }}</h5>
        <h5 style="margin: 0; color: red;" *ngIf="form.error && form.message">{{ form.message }}</h5>
    </div>

    <div *ngIf="form.list.length > 0">

        <!-- Search -->
        <table style="width: 100%; margin-bottom: 10px;">
            <tr>
                <td align="center">

                    <label><b>StaffName: </b></label>

                    <input type="text"
                           name="StaffName"
                           [(ngModel)]="form.StaffName"
                           placeholder="Enter StaffName"
                           style="width: 200px; padding: 4px;">

                    <button (click)="search()" style="margin-left: 5px; padding: 4px 10px;">Search</button>
                    <button (click)="reset()" style="margin-left: 5px; padding: 4px 10px;">Reset</button>

                </td>
            </tr>
        </table>

        <!-- Table -->
        <div style="overflow-x: auto;">

            <table border="1"
                   style="width: 100%; border-collapse: collapse; text-align: center;">

                <tr style="background-color: #e1e6f1e3;">
                    <th>
                        <input type="checkbox"
                               [(ngModel)]="isMasterSel"
                               (change)="checkUncheckAll($event)" />
                    </th>
                    <th>S.No</th>
                    <th>StaffName</th>
                    <th>Shift</th>
                    <th>Salary</th>
                    <th>Edit</th>
                </tr>

                <tr *ngFor="let m of form.list; let i = index">

                    <td>
                        <input type="checkbox"
                               #checkboxes
                               (change)="checklistUpdate()"
                               [id]="m.id">
                    </td>

                    <td>{{(form.pageNo*5)+i+1}}</td>

                    <!-- FIX -->
                    <td>{{m.StaffName}}</td>

                    <td>{{m.shift}}</td>
                    <td>{{m.salary}}</td>

                    <td>
                        <a (click)="forward('/Security/' + m.id)"
                           style="cursor: pointer; color: blue;">
                            Edit
                        </a>
                    </td>

                </tr>

            </table>
        </div>

        <!-- Buttons -->
        <table style="width: 100%; margin-top: 10px;">
            <tr>

                <td style="width: 25%">
                    <button (click)="previous()"
                            [disabled]="form.pageNo == 0"
                            style="padding: 4px 10px;">
                        Previous
                    </button>
                </td>

                <td align="center" style="width: 25%">
                    <button (click)="forward('/Security')"
                            style="padding: 4px 10px;">
                        New
                    </button>
                </td>

                <td align="center" style="width: 25%">
                    <button (click)="delete()"
                            style="padding: 4px 10px;">
                        Delete
                    </button>
                </td>

                <td style="width: 25%" align="right">
                    <button (click)="next()"
                            [disabled]="form.list.length < 5"
                            style="padding: 4px 10px;">
                        Next
                    </button>
                </td>

            </tr>
        </table>

    </div>

    <br>

    <!-- Back -->
    <div *ngIf="form.list.length == 0" align="center">
        <button (click)="reset()" style="padding: 5px 12px;">Back</button>
    </div>

</div>

<app-footer></app-footer>
