<app-navbar></app-navbar>

<div align="center"
     style="min-height: 90vh;
            padding: 40px;
            background-image: url('assets/whit.jpg');
            background-size: cover;
            background-position: center;">

    <!-- Heading -->
    <h1 *ngIf="!form.data.id" style="margin-bottom: 10px; color: navy">
        <i class="fa-solid fa-recycle"></i> Add Purge
    </h1>

    <h1 *ngIf="form.data.id>0" style="margin-bottom: 10px; color: navy">
        <i class="fa-solid fa-pen-to-square"></i> Update Purge
    </h1>

    <!-- Message -->
    <div style="height: 25px; margin-bottom: 15px;">
        <h3 class="text-success m-0" *ngIf="!form.error && form.message">
            {{ form.message }}
        </h3>
        <h3 class="text-danger m-0" *ngIf="form.error && form.message">
            {{ form.message }}
        </h3>
    </div>

    <!-- Table Form -->
    <table class="table table-bordered shadow"
           style="background:white; border-radius:10px; width:420px; overflow:hidden;">

        <!-- Holiday Code -->
        <tr>
            <th class="text-start p-2">
                <i class="fa-solid fa-code"></i>
                Purge Code <span class="text-danger">*</span>
            </th>
            <td class="p-2">
                <input type="text"
                       class="form-control form-control-sm"
                       name="purgeCode"
                       [(ngModel)]="form.data.purgeCode"
                       placeholder="Enter purge Code">
            </td>
        </tr>
        <tr>
            <td></td>
            <td class="text-danger small">
                {{form.inputerror.purgeCode}}
            </td>
        </tr>

        <!-- Holiday Name -->
        <tr>
            <th class="text-start p-2">
                <i class="fa-solid fa-gift"></i>
                Data Type <span class="text-danger">*</span>
            </th>
            <td class="p-2">
                <input type="text"
                       class="form-control form-control-sm"
                       name="dataType"
                       [(ngModel)]="form.data.dataType"
                       placeholder="Enter Data Type">
            </td>
        </tr>
        <tr>
            <td></td>
            <td class="text-danger small">
                {{form.inputerror.dataType}}
            </td>
        </tr>

        <!-- Holiday Date -->
        <tr>
            <th class="text-start p-2">
                <i class="fa-solid fa-calendar-days"></i>
                LastRunDate <span class="text-danger">*</span>
            </th>
            <td class="p-2">
                <input type="date"
                       class="form-control form-control-sm"
                       name="lastRunDate"
                       [(ngModel)]="form.data.lastRunDate">
            </td>
        </tr>
        <tr>
            <td></td>
            <td class="text-danger small">
                {{form.inputerror.lastRunDate}}
            </td>
        </tr>

        <!-- Holiday Type -->
        <tr>
            <th class="text-start p-2">
                <i class="fa-solid fa-tag"></i>
                Status <span class="text-danger">*</span>
            </th>
            <td class="p-2">
                <input type="text"
                       class="form-control form-control-sm"
                       name="status"
                       [(ngModel)]="form.data.status"
                       placeholder="Enter Status ">
            </td>
        </tr>
        <tr>
            <td></td>
            <td class="text-danger small">
                {{form.inputerror.status}}
            </td>
        </tr>

        <!-- Button -->
        <tr>
            <td></td>
            <td class="p-3">
                <button class="btn btn-primary btn-sm px-4"
                        (click)="submit()">
                    <i class="fa-solid fa-floppy-disk"></i> Save
                </button>
            </td>
        </tr>

    </table>
</div>

<app-footer></app-footer>
