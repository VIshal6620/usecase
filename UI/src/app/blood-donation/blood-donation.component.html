<app-navbar></app-navbar>
<br><br><br>
<div align="center">
    <h1 *ngIf="!form.data.id" align="center" style="margin-bottom: 5px; color: navy">Add Blood Donation</h1>
    <h1 *ngIf="form.data.id>0" align="center" style="margin-bottom: 5px; color: navy">Update BloodDonation</h1>

    <div style="height: 20px; margin-bottom: 10px; text-align: center;">
        <h3 style="margin: 0; color: green;" *ngIf="!form.error && form.message">{{ form.message }}</h3>
        <h3 style="margin: 0; color: rgb(22, 106, 47);" *ngIf="form.error && form.message">{{ form.message }}</h3>
    </div>

    <table>
        <tr>
            <th align="left">DonorName<span style="color: red">*</span></th>
            <td><input type="text" name="donorName" [(ngModel)]="form.data.donorName" placeholder="Enter donorName" style="width: 97%;">
            </td>
            <td style="position: fixed; color: red;">{{form.inputerror.donorName}}</td>
        </tr>

        <!-- Blood Group -->
        <tr>
            <th align="left">Blood Group<span style="color: red">*</span></th>
            <td>
                <select [(ngModel)]="form.data.bloodGroup" name="bloodGroup" style="width: 97%;">

                    <option value="undefined">------------Select------------</option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </td>
            <td style="color: red;">
                {{form.inputerror.bloodGroup}}
            </td>
        </tr>

        <tr>
            <th align="left">DonationDate<span style="color: red">*</span></th>
            <td><input type="date" name="donationDate" [(ngModel)]="form.data.donationDate"
                    placeholder="Enter donationDate" style="width: 97%;"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.donationDate}}</td>
        </tr>

        <tr>
            <th align="left">ContactNumber<span style="color: red">*</span></th>
            <td><input type="text" name="contactNumber" [(ngModel)]="form.data.contactNumber"
                    placeholder="Enter contactNumber" style="width: 97%;"></td>
            <td style="position: fixed; color: red;">{{form.inputerror.contactNumber}}</td>
        </tr>

        <tr></tr>

        <tr>
            <th></th>
            <td align="left" colspan="2">
                <button (click)="submit()">save</button> &nbsp;
            </td>
        </tr>
    </table>
</div>

<app-footer></app-footer>
